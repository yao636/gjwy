<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型,框模型,box model </title>
    <style>
        body,u1,p,h1,h2,h3,h4,h5,h6{
            padding:0;
            margin:0;
        }
         .a{
            width: 500px;
            height: 300px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;
            margin: 40px auto;
        }
        .b{
            width: 500px;
            height: 300px;
            border: 2px dashed rgb(199, 53, 179);
            margin: 50px auto 40px;
        }
        .c{
            width: 500px;
            height: 300px;
            border: 5px solid red;
            padding: 20px;
            margin: 30px auto;
        }
    </style>
       
</head>
<body>
    <div class="a">722陈弘毅</div>
    <div class="b">722陈弘毅</div>
