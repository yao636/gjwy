<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        u1{list-style:none;}
        img{
            display:block;
        }
        .slist{
            display:flex;
            justify-content:space-between;
            padding:20px;
        }
        .slist li{
            width:30%;
            margin-right:3px;
            flex-grow:1;
            position:relative;
        }
        .slist li img{
            width:100%;
            height:200px;
        }
        .slist li p{
            text-align:center;
            line-height:24px;
            font: size 12px;
            color:#039;
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            background:rgba(0,0,0,.5);
            color:#fff;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <ul class="slist">
        <li>
            <img src="img/a1.jpg">
            <p>陈弘毅的标题1</p>
        </li>
        <li>
            <img src="img/a2.jpg">
            <p>陈弘毅的标题2</p>
        </li>
        <li>
            <img src="img/a3.jpg">
            <p>陈弘毅的标题3</p>
        </li>
    </ul>
</body>
</html>
