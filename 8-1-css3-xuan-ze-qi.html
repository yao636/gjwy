<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin:10px;
        }
        .box{
            width:150px;
            height:150px;
            border:1px solid #ccc;
            margin:10px;
            display: flex;
            /*水平垂直居中 */
            justify-content: center;
            align-items: center;
            font-size:40px;
            transition: all 0.6s;
            box-sizing: border-box;
            position:relative;
       }
       .box:first-child:hover{
            background-color: #f00;
            color:#fff;
            font-size:140px;
        }
       .box:nth-child(2):hover{
            border-radius:50%;
            border-width:10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 10px 10px #cc1fb8;
        }
        .box:nth-of-type(5):hover{
            background: linear-gradient(#fff, #f00, rgb(53, 29, 185));
        }
        .box:nth-of-type(5)+.box:hover{
            background: radial-gradient(circle, rgb(29, 203, 93), rgb(79, 25, 204));
        }
        .box:nth-of-type(7):hover{
            transform:scale(1.5)
        }
        .box:nth-of-type(8):hover{
            transform:translateX(150px)
        }
        .box:nth-of-type(9):hover{
            transform: rotateZ(-1800deg)
        }
        .box:nth-of-type(10):hover{
            transform: skewX(20deg) translateY(50px)
        }
        .box:nth-last-child(2):hover::before{
            content: "*";
            color: red;
        }
        .box:nth-child(12):hover::after{
            content:"陈弘毅";
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
            height:100%;
            position:absolute;
            background:#222;
            color:#fff;
        }
        .box:nth-child(3n):hover{
            border:3px solid red;
        }
        /*扩展2：鼠标在偶数个盒子上时，自定义效果*/
        .box:nth-child(even):hover{
            background-color: orange;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
