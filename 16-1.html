    <title>16-1 JavaScript 数组方法演示</title>
    <link rel="stylesheet" href="font/font_5244855_fm8s0yq40te/iconfont.css">
    <style>
        :root {
            --chen_bg: #eef2ff;
            --chen_surface: #ffffff;
            --chen_text: #1e293b;
            --chen_text_soft: #475569;
            --chen_muted: #64748b;
            --chen_primary: #4f46e5;
            --chen_primary_soft: #e0e7ff;
            --chen_accent: #0ea5e9;
            --chen_danger: #ef4444;
            --chen_ok: #10b981;
            --chen_border: #dbe3f2;
            --chen_radius: 14px;
            --chen_shadow: 0 18px 45px -28px rgba(30, 64, 175, 0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 12% 0%, rgba(99, 102, 241, 0.16), transparent 32rem),
                radial-gradient(circle at 88% 12%, rgba(14, 165, 233, 0.14), transparent 28rem),
                var(--chen_bg);
            color: var(--chen_text);
            line-height: 1.65;
            min-height: 100vh;
        }

        .chen_page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 34px 22px 40px;
        }

        /* ---------- 头部 ---------- */
        .chen_header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed 55%, #0ea5e9);
            color: #fff;
            border-radius: var(--chen_radius);
            padding: 26px 30px;
            display: flex;
            align-items: center;
            gap: 18px;

        .chen_header_icon {
            width: 56px; height: 56px;

            flex: none;
        }
        .chen_header h1 { font-size: 24px; letter-spacing: 1px; }
        .chen_header p { font-size: 13.5px; opacity: .92; margin-top: 4px; }

        /* ---------- 布局 ---------- */
        .chen_layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 18px;
            margin-top: 18px;
            align-items: start;
        }
        @media (max-width: 860px) {
            .chen_layout { grid-template-columns: 1fr; }
        }

        .chen_card {
            background: var(--chen_surface);
            border: 1px solid var(--chen_border);
            border-radius: var(--chen_radius);
            box-shadow: var(--chen_shadow);
        }

        /* ---------- 方法列表 ---------- */
        .chen_list { padding: 12px; max-height: 560px; overflow: auto; }
        .chen_group_title {
            font-size: 12px;
            color: var(--chen_muted);
            padding: 10px 10px 6px;
            letter-spacing: .5px;
        }
        .chen_item {
            width: 100%;
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px;
            border: none; background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--chen_text_soft);
            font-family: inherit;
            text-align: left;
            transition: background .18s, color .18s;
        }
        .chen_item .iconfont { font-size: 16px; color: var(--chen_muted); }
        .chen_item:hover { background: var(--chen_primary_soft); }
        .chen_item.chen_active {
            background: var(--chen_primary);
            color: #fff;
            font-weight: 600;
        }
        .chen_item.chen_active .iconfont { color: #fff; }
        .chen_item code { font-family: Consolas, Monaco, monospace; }

        /* ---------- 舞台 ---------- */
        .chen_main { padding: 22px 24px; }
        .chen_method_head {
            display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        }
        .chen_method_head h2 {
            font-size: 20px;
            font-family: Consolas, Monaco, monospace;
            color: var(--chen_primary);
        }
        .chen_tag {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 999px;
        }
        .chen_tag.chen_mut { background: #fee2e2; color: #b91c1c; }
        .chen_tag.chen_immut { background: #d1fae5; color: #047857; }
        .chen_desc { color: var(--chen_text_soft); font-size: 14px; margin-top: 8px; }

        .chen_stage_label {
            font-size: 12px; color: var(--chen_muted);
            margin: 18px 0 8px; letter-spacing: .5px;
        }
        .chen_stage {
            min-height: 108px;
            border: 1.5px dashed var(--chen_border);
            border-radius: 12px;
            background: #f8faff;
            display: flex; align-items: center;
            gap: 10px;
            padding: 14px 16px;
            overflow-x: auto;
        }
        .chen_box {
            flex: none;
            width: 66px; height: 66px;
            border-radius: 12px;
            background: linear-gradient(160deg, #eef2ff, #e0e7ff);
            border: 1.5px solid #c7d2fe;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
            transition: transform .3s, border-color .3s, background .3s;
        }
        .chen_box strong {
            font-size: 18px;
            font-family: Consolas, Monaco, monospace;
            color: var(--chen_text);
            word-break: break-all;
            line-height: 1.2;
            padding: 0 4px;
        }
        .chen_box span {
            position: absolute;
            bottom: -21px;
            font-size: 11px;
            color: var(--chen_muted);
            font-family: Consolas, monospace;
        }
        .chen_box.chen_in { animation: chen_pop_in .45s cubic-bezier(.34,1.56,.64,1) both; }
        .chen_box.chen_out_left { animation: chen_go_left .38s ease-in both; }
        .chen_box.chen_out_up { animation: chen_go_up .38s ease-in both; }
        .chen_box.chen_flash { border-color: var(--chen_primary); background: #fff; box-shadow: 0 0 0 4px rgba(79,70,229,.18); }
        @keyframes chen_pop_in {
            from { transform: scale(.3); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        @keyframes chen_go_left {
            to { transform: translateX(-70px) scale(.4); opacity: 0; }
        }
        @keyframes chen_go_up {
            to { transform: translateY(-70px) scale(.4); opacity: 0; }
        }
        .chen_arrow {
            flex: none;
            color: #a5b4fc;
            font-size: 20px;
            font-weight: 700;
        }
        .chen_empty {
            display: flex; align-items: center; gap: 8px;
            color: var(--chen_muted); font-size: 13px;
        }

        /* ---------- 参数与按钮 ---------- */
        .chen_controls {
            margin-top: 24px;
            display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
        }
        .chen_field { display: flex; flex-direction: column; gap: 5px; }
        .chen_field label { font-size: 12px; color: var(--chen_muted); }
        .chen_field input, .chen_field select {
            width: 130px;
            padding: 8px 10px;
            border: 1px solid var(--chen_border);
            border-radius: 9px;
            font-size: 14px;
            font-family: Consolas, monospace;
            background: #fbfcff;
            color: var(--chen_text);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        .chen_field input:focus, .chen_field select:focus {
            border-color: var(--chen_primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.14);
        }
        .chen_btn {
            padding: 10px 20px;
            border: none; border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #6d28d9);
            color: #fff;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            transition: transform .15s, box-shadow .15s;
        }
        .chen_btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -10px rgba(79,70,229,.7); }
        .chen_btn:active { transform: translateY(0); }
        .chen_btn.chen_ghost {
            background: var(--chen_surface);
            color: var(--chen_primary);
            border: 1px solid #c7d2fe;
        }

        /* ---------- 结果 ---------- */
        .chen_console {
            margin-top: 22px;
            background: #1e1b4b;
            border-radius: 12px;
            padding: 16px 18px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13.5px;
            color: #c7d2fe;
            min-height: 96px;
        }
        .chen_console .chen_c_code { color: #fef08a; }
        .chen_console .chen_c_ret  { color: #6ee7b7; }
        .chen_console .chen_c_dim  { color: #818cf8; }
        .chen_console .chen_c_note { color: #f0abfc; }
        .chen_console div { margin: 3px 0; }

        .chen_ret_stage {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap; margin-top: 12px;
        }
        .chen_ret_box {
            padding: 7px 13px;
            border-radius: 9px;
            background: #ecfdf5;
            border: 1.5px solid #6ee7b7;
            color: #047857;
            font-family: Consolas, monospace;
            font-size: 14px;
            font-weight: 600;
            animation: chen_pop_in .45s cubic-bezier(.34,1.56,.64,1) both;
        }

        /* ---------- 自定义数组 ---------- */
        .chen_editor {
            margin-top: 18px;
            padding: 14px 16px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .chen_editor .chen_field input { width: 280px; }
        .chen_editor span { font-size: 13px; color: var(--chen_muted); }

        /* ---------- 页脚 ---------- */
        .chen_footer {
            margin-top: 30px;
            text-align: center;
            color: var(--chen_muted);
            font-size: 13px;
            padding: 14px 0 4px;
            border-top: 1px solid var(--chen_border);
        }
    </style>

<body>
    <div class="chen_page">
        <header class="chen_header">
            <div class="chen_header_icon"><span class="iconfont icon-jiazaixiao"></span></div>
            <div>
                <h1>JavaScript 数组方法可视化演示</h1>
                <p>选择一个方法 → 填写参数 → 点击运行，直观观察数组的变化与返回值</p>
            </div>
        </header>

        <div class="chen_layout">
            <!-- 方法列表 -->
            <nav class="chen_card chen_list" id="chen_list"></nav>

            <!-- 演示舞台 -->
            <main class="chen_card chen_main">
                <div class="chen_method_head">
                    <h2 id="chen_method_name">arr.push()</h2>
                    <span class="chen_tag chen_mut" id="chen_method_tag">改变原数组</span>
                </div>
                <p class="chen_desc" id="chen_method_desc"></p>

                <p class="chen_stage_label">当前数组 arr（下方小数字为索引 index）</p>
                <div class="chen_stage" id="chen_stage"></div>

                <div class="chen_controls" id="chen_controls">
                    <button class="chen_btn" id="chen_run_btn">
                        <span class="iconfont icon-chenggong"></span>运行演示
                    </button>
                </div>

                <div class="chen_console" id="chen_console">
                    <div class="chen_c_dim">// 控制台输出：点击"运行演示"查看结果</div>
                </div>
                <div class="chen_ret_stage" id="chen_ret_stage"></div>

                <div class="chen_card chen_editor">
                    <span class="iconfont icon-shezhi" style="color: var(--chen_primary);"></span>
                    <div class="chen_field">
                        <label>自定义数组（逗号分隔）</label>
                        <input type="text" id="chen_array_input" value="3, 7, 12, 5, 20">
                    </div>
                    <button class="chen_btn chen_ghost" id="chen_apply_btn">
                        <span class="iconfont icon-bianji"></span>应用
                    </button>
                    <button class="chen_btn chen_ghost" id="chen_reset_btn">
                        <span class="iconfont icon-kongshuju"></span>恢复默认
                    </button>
                </div>
            </main>
        </div>

        <footer class="chen_footer">学号 24001010722 &nbsp;|&nbsp; 姓名 陈弘毅</footer>
    </div>

    <script>
        "use strict";

        /* ================= 数据与方法定义 ================= */
        var chen_arr = [3, 7, 12, 5, 20];
        var chen_default_arr = [3, 7, 12, 5, 20];
        var chen_selected = null;

        // 参数解析：能转数字就转数字，否则保留字符串
        function chenParse(v) {
            var s = String(v).trim();
            if (s === "") return s;
            var n = Number(s);
            return (s !== "" && !isNaN(n)) ? n : s;
        }

        var CHEN_METHODS = [
            {
                group: "增删操作（改变原数组）",
                items: [
                    {
                        name: "push", icon: "icon-bianji", mut: true,
                        desc: "把元素添加到数组【末尾】，返回添加后的数组长度。",
                        params: [{ key: "val", label: "新增元素", def: "9" }],
                        run: function (a, p) {
                            var r = a.push(chenParse(p.val));
                            return { ret: r, code: "arr.push(" + p.val + ")", added: [a.length - 1] };
                        }
                    },
                    {
                        name: "pop", icon: "icon-shanchu", mut: true,
                        desc: "删除数组【末尾】的元素，返回被删除的那个元素。空数组返回 undefined。",
                        params: [],
                        run: function (a) {
                            if (!a.length) return { ret: undefined, code: "arr.pop()", note: "数组已空，返回 undefined" };
                            return { ret: a[a.length - 1], code: "arr.pop()", removed: [a.length - 1], dir: "up" };
                        }
                    },
                    {
                        name: "shift", icon: "icon-shanchu", mut: true,
                        desc: "删除数组【开头】的元素，其余元素整体前移，返回被删除的元素。",
                        params: [],
                        run: function (a) {
                            if (!a.length) return { ret: undefined, code: "arr.shift()", note: "数组已空，返回 undefined" };
                            return { ret: a[0], code: "arr.shift()", removed: [0], dir: "left" };
                        }
                    },
                    {
                        name: "unshift", icon: "icon-bianji", mut: true,
                        desc: "把元素添加到数组【开头】，已有元素整体后移，返回新长度。",
                        params: [{ key: "val", label: "新增元素", def: "9" }],
                        run: function (a, p) {
                            var r = a.unshift(chenParse(p.val));
                            return { ret: r, code: "arr.unshift(" + p.val + ")", added: [0] };
                        }
                    },
                    {
                        name: "splice", icon: "icon-shezhi", mut: true,
                        desc: "万能方法：从指定位置开始，删除若干元素并（可选）插入新元素，返回被删除的元素组成的数组。",
                        params: [
                            { key: "start", label: "起始索引", def: "1" },
                            { key: "del", label: "删除个数", def: "1" },
                            { key: "ins", label: "插入元素(可空)", def: "99" }
                        ],
                        run: function (a, p) {
                            var s = Math.max(0, Math.min(Number(p.start) || 0, a.length));
                            var d = Math.max(0, Number(p.del) || 0);
                            var removedIdx = [];
                            for (var i = s; i < s + d && i < a.length; i++) removedIdx.push(i);
                            var insItems = String(p.ins).trim() === "" ? [] : p.ins.split(",").map(chenParse);
                            var args = [s, d].concat(insItems);
                            var removedVals = a.splice.apply(a, args);
                            var addedIdx = [];
                            for (var j = 0; j < insItems.length; j++) addedIdx.push(s + j);
                            return {
                                ret: removedVals, code: "arr.splice(" + p.start + ", " + p.del + (insItems.length ? ", " + p.ins : "") + ")",
                                removed: removedIdx, dir: "up", added: addedIdx
                            };
                        }
                    }
                ]
            },
            {
                group: "截取与合并（不改变原数组）",
                items: [
                    {
                        name: "slice", icon: "icon-gengduo", mut: false,
                        desc: "截取 [start, end) 范围的元素，返回【新数组】，原数组不变。",
                        params: [
                            { key: "start", label: "开始索引", def: "1" },
                            { key: "end", label: "结束索引(不含)", def: "4" }
                        ],
                        run: function (a, p) {
                            var s = p.start.trim() === "" ? undefined : Number(p.start);
                            var e = p.end.trim() === "" ? undefined : Number(p.end);
                            return { ret: a.slice(s, e), code: "arr.slice(" + p.start + ", " + p.end + ")" };
                        }
                    },
                    {
                        name: "concat", icon: "icon-fenxiang", mut: false,
                        desc: "把其他数组或元素拼接到现在数组的后面，返回【新数组】，原数组不变。",
                        params: [{ key: "other", label: "拼接内容", def: "99, 100" }],
                        run: function (a, p) {
                            var items = p.other.split(",").map(chenParse);
                            return { ret: a.concat(items), code: "arr.concat([" + p.other + "])" };
                        }
                    },
                    {
                        name: "join", icon: "icon-dingdan", mut: false,
                        desc: "把所有元素用指定分隔符连接成一个【字符串】，原数组不变。",
                        params: [{ key: "sep", label: "分隔符", def: " - " }],
                        run: function (a, p) {
                            return { ret: a.join(p.sep), code: "arr.join('" + p.sep + "')" };
                        }
                    }
                ]
            },
            {
                group: "排序与查找",
                items: [
                    {
                        name: "reverse", icon: "icon-fenxiang", mut: true,
                        desc: "把数组元素【倒序】排列，改变原数组，返回原数组的引用。",
                        params: [],
                        run: function (a) {
                            return { ret: a.reverse(), code: "arr.reverse()", flashAll: true };
                        }
                    },
                    {
                        name: "sort", icon: "icon-rili", mut: true,
                        desc: "对元素排序。注意：不传比较函数时按【字符串】比较，所以 12 会排在 3 前面！传 (a, b) => a - b 才是数字升序。",
                        params: [],
                        run: function (a) {
                            return { ret: a.sort(), code: "arr.sort()", note: "默认按 Unicode 字符串排序，试试比较函数 arr.sort((a,b)=>a-b)", flashAll: true };
                        }
                    },
                    {
                        name: "indexOf", icon: "icon-sousuo", mut: false,
                        desc: "查找元素第一次出现的索引，找不到返回 -1。",
                        params: [{ key: "val", label: "查找值", def: "12" }],
                        run: function (a, p) {
                            var v = chenParse(p.val);
                            var idx = a.indexOf(v);
                            return { ret: idx, code: "arr.indexOf(" + p.val + ")", flashIdx: idx >= 0 ? [idx] : [] };
                        }
                    },
                    {
                        name: "includes", icon: "icon-sousuo", mut: false,
                        desc: "判断数组是否包含某个元素，返回 true / false。",
                        params: [{ key: "val", label: "查找值", def: "12" }],
                        run: function (a, p) {
                            var v = chenParse(p.val);
                            var has = a.includes(v);
                            return { ret: has, code: "arr.includes(" + p.val + ")", flashIdx: has ? [a.indexOf(v)] : [] };
                        }
                    }
                ]
            },
            {
                group: "迭代与加工（高阶方法）",
                items: [
                    {
                        name: "map", icon: "icon-shezhi", mut: false,
                        desc: "对每个元素执行同一个函数加工，返回由加工结果组成的【新数组】，长度不变。",
                        params: [{ key: "op", label: "加工方式", type: "select", def: "x * 2",
                            options: ["x * 2", "x + 10", "x * x"] }],
                        run: function (a, p) {
                            var fns = {
                                "x * 2": function (x) { return x * 2; },
                                "x + 10": function (x) { return Number(x) + 10; },
                                "x * x": function (x) { return x * x; }
                            };
                            return { ret: a.map(fns[p.op]), code: "arr.map(x => " + p.op + ")" };
                        }
                    },
                    {
                        name: "filter", icon: "icon-jinggao", mut: false,
                        desc: "筛选出满足条件的元素，返回【新数组】，长度可能变短。",
                        params: [{ key: "n", label: "大于该值", def: "8" }],
                        run: function (a, p) {
                            return { ret: a.filter(function (x) { return x > Number(p.n); }), code: "arr.filter(x => x > " + p.n + ")" };
                        }
                    },
                    {
                        name: "reduce", icon: "icon-shoucang", mut: false,
                        desc: "从左到右把元素逐步累积成一个值（这里是求和），返回累加结果。",
                        params: [],
                        run: function (a) {
                            return { ret: a.reduce(function (s, x) { return s + x; }, 0), code: "arr.reduce((sum, x) => sum + x, 0)" };
                        }
                    },
                    {
                        name: "forEach", icon: "icon-gengduo", mut: false,
                        desc: "遍历每个元素执行操作，【没有返回值】（undefined），常用于打印或修改外部变量。",
                        params: [],
                        run: function (a) {
                            var logs = [];
                            a.forEach(function (x, i) { logs.push("索引 " + i + " → " + x); });
                            return { ret: undefined, code: "arr.forEach((x, i) => console.log(i, x))", logs: logs };
                        }
                    },
                    {
                        name: "find", icon: "icon-sousuo", mut: false,
                        desc: "找到第一个满足条件的元素并返回它，找不到返回 undefined。",
                        params: [{ key: "n", label: "大于该值", def: "10" }],
                        run: function (a, p) {
                            var hit = a.find(function (x) { return x > Number(p.n); });
                            return { ret: hit, code: "arr.find(x => x > " + p.n + ")", flashIdx: hit !== undefined ? [a.indexOf(hit)] : [] };
                        }
                    }
                ]
            }
        ];

        /* ================= 工具函数 ================= */
        function chenFormat(v) {
            if (v === undefined) return "undefined";
            if (v === null) return "null";
            if (Array.isArray(v)) return "[" + v.map(chenFormat).join(", ") + "]";
            if (typeof v === "string") return "'" + v + "'";
            return String(v);
        }

        function chenGetAllMethods() {
            var all = [];
            CHEN_METHODS.forEach(function (g) { g.items.forEach(function (m) { all.push(m); }); });
            return all;
        }

        /* ================= 渲染方法列表 ================= */
        function chenRenderList() {
            var list = document.getElementById("chen_list");
            list.innerHTML = "";
            CHEN_METHODS.forEach(function (g) {
                var t = document.createElement("div");
                t.className = "chen_group_title";
                t.textContent = g.group;
                list.appendChild(t);
                g.items.forEach(function (m) {
                    var btn = document.createElement("button");
                    btn.className = "chen_item" + (chen_selected === m ? " chen_active" : "");
                    btn.innerHTML = '<span class="iconfont ' + m.icon + '"></span><code>' + m.name + '()</code>';
                    btn.addEventListener("click", function () {
                        chen_selected = m;
                        chenRenderList();
                        chenRenderMethod();
                    });
                    list.appendChild(btn);
                });
            });
        }

        /* ================= 渲染当前方法面板 ================= */
        function chenRenderMethod() {
            var m = chen_selected;
            document.getElementById("chen_method_name").textContent = "arr." + m.name + "()";
            var tag = document.getElementById("chen_method_tag");
            tag.textContent = m.mut ? "改变原数组" : "不改变原数组";
            tag.className = "chen_tag " + (m.mut ? "chen_mut" : "chen_immut");
            document.getElementById("chen_method_desc").textContent = m.desc;

            // 重建参数输入区
            var controls = document.getElementById("chen_controls");
            controls.innerHTML = "";
            m.params.forEach(function (p) {
                var field = document.createElement("div");
                field.className = "chen_field";
                var label = document.createElement("label");
                label.textContent = p.label;
                field.appendChild(label);
                var input;
                if (p.type === "select") {
                    input = document.createElement("select");
                    p.options.forEach(function (o) {
                        var opt = document.createElement("option");
                        opt.value = o; opt.textContent = o;
                        if (o === p.def) opt.selected = true;
                        input.appendChild(opt);
                    });
                } else {
                    input = document.createElement("input");
                    input.type = "text";
                    input.value = p.def;
                }
                input.id = "chen_p_" + p.key;
                field.appendChild(input);
                controls.appendChild(field);
            });
            var runBtn = document.createElement("button");
            runBtn.className = "chen_btn";
            runBtn.id = "chen_run_btn";
            runBtn.innerHTML = '<span class="iconfont icon-chenggong"></span>运行演示';
            runBtn.addEventListener("click", chenRunMethod);
            controls.appendChild(runBtn);

            chenRenderStage(new Set());
            document.getElementById("chen_ret_stage").innerHTML = "";
        }

        /* ================= 渲染数组舞台 ================= */
        function chenRenderStage(addedSet, flashSet) {
            var stage = document.getElementById("chen_stage");
            stage.innerHTML = "";
            if (!chen_arr.length) {
                stage.innerHTML = '<div class="chen_empty"><span class="iconfont icon-kongshuju"></span>数组是空的 [ ]</div>';
                return;
            }
            chen_arr.forEach(function (v, i) {
                if (i > 0) {
                    var arrow = document.createElement("span");
                    arrow.className = "chen_arrow";
                    arrow.textContent = "›";
                    stage.appendChild(arrow);
                }
                var box = document.createElement("div");
                box.className = "chen_box";
                if (addedSet && addedSet.has(i)) box.classList.add("chen_in");
                if (flashSet && flashSet.has(i)) box.classList.add("chen_flash");
                var strong = document.createElement("strong");
                strong.textContent = String(v);
                var idx = document.createElement("span");
                idx.textContent = "[" + i + "]";
                box.appendChild(strong);
                box.appendChild(idx);
                stage.appendChild(box);
            });
        }

        /* ================= 运行演示 ================= */
        function chenRunMethod() {
            var m = chen_selected;
            var params = {};
            m.params.forEach(function (p) {
                params[p.key] = document.getElementById("chen_p_" + p.key).value;
            });

            var before = chen_arr.slice();
            var res = m.run(chen_arr, params);
            res.removed = res.removed || [];
            res.added = res.added || [];

            // 有被删除的元素：先播放"飞出"动画
            var stage = document.getElementById("chen_stage");
            var allBoxes = stage.querySelectorAll(".chen_box");
            var removedEls = res.removed.map(function (i) { return allBoxes[i]; }).filter(Boolean);
            removedEls.forEach(function (el) {
                el.classList.add(res.dir === "left" ? "chen_out_left" : "chen_out_up");
            });

            setTimeout(function () {
                chenRenderStage(new Set(res.added), new Set(res.flashIdx || []));
                chenShowResult(m, params, before, res);
            }, removedEls.length ? 400 : 0);

            if (res.flashAll) {
                setTimeout(function () { chenRenderStage(new Set(), new Set(chen_arr.map(function (_, i) { return i; }))); }, removedEls.length ? 400 : 0);
            }
        }

        /* ================= 显示结果 ================= */
        function chenShowResult(m, params, before, res) {
            var box = document.getElementById("chen_console");
            var html = '<div class="chen_c_code">&gt; ' + res.code + '</div>';
            html += '<div class="chen_c_ret">← 返回值: ' + chenFormat(res.ret) + '</div>';
            html += '<div class="chen_c_dim">原数组: ' + chenFormat(before) + '</div>';
            if (m.mut) {
                html += '<div class="chen_c_dim">新数组: ' + chenFormat(chen_arr) + ' <span class="chen_c_note">// 已改变原数组</span></div>';
            } else {
                html += '<div class="chen_c_dim">原数组: ' + chenFormat(chen_arr) + ' <span class="chen_c_note">// 保持不变</span></div>';
            }
            (res.logs || []).forEach(function (l) {
                html += '<div class="chen_c_ret">  console: ' + l + '</div>';
            });
            if (res.note) html += '<div class="chen_c_note">💡 ' + res.note + '</div>';
            box.innerHTML = html;

            // 返回值如果是数组，用小方块展示
            var retStage = document.getElementById("chen_ret_stage");
            retStage.innerHTML = "";
            if (Array.isArray(res.ret) && res.ret.length) {
                var lbl = document.createElement("span");
                lbl.className = "chen_stage_label";
                lbl.style.margin = "0";
                lbl.textContent = "返回的新数组：";
                retStage.appendChild(lbl);
                res.ret.forEach(function (v) {
                    var chip = document.createElement("span");
                    chip.className = "chen_ret_box";
                    chip.textContent = chenFormat(v);
                    retStage.appendChild(chip);
                });
            }
        }

        /* ================= 数组编辑 ================= */
        function chenApplyArray(inputId, fallback) {
            var raw = document.getElementById(inputId).value.trim();
            if (raw === "") { chen_arr = []; }
            else {
                chen_arr = raw.split(",").map(function (s) { return s.trim(); }).filter(function (s) { return s !== ""; }).map(chenParse);
            }
            chenRenderStage(new Set());
            document.getElementById("chen_ret_stage").innerHTML = "";
            document.getElementById("chen_console").innerHTML =
                '<div class="chen_c_code">arr = ' + chenFormat(chen_arr) + '</div><div class="chen_c_dim">// 数组已更新，选择方法继续实验</div>';
        }

        /* ================= 初始化 ================= */
        (function chenInit() {
            chen_selected = chenGetAllMethods()[0]; // 默认 push
            chenRenderList();
            chenRenderMethod();
            chenApplyArray("chen_array_input");

            document.getElementById("chen_apply_btn").addEventListener("click", function () {
                chenApplyArray("chen_array_input");
            });
            document.getElementById("chen_reset_btn").addEventListener("click", function () {
                document.getElementById("chen_array_input").value = chen_default_arr.join(", ");
                chenApplyArray("chen_array_input");
            });
            // 输入框回车即运行
            document.addEventListener("keydown", function (e) {
                if (e.key === "Enter" && document.activeElement &&
                    document.activeElement.tagName === "INPUT" &&
                    document.activeElement.id.indexOf("chen_p_") === 0) {
                    chenRunMethod();
                }
            });
        })();
    </script>
</body>
</html>
