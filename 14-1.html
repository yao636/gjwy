<!DOCTYPE html>

    <title>陈弘毅</title>
</head>
<body>
    <h2>陈弘毅：JavaScript</h2>
    <script>
        //输出，陈弘毅你好，document,alert,console.log三种方式

        alert("你好，陈弘毅!");
        console.log("你好，陈弘毅!");
        //confirm和prompt
        confirm("你好，陈弘毅!");
        prompt("你好，陈弘毅!");
    </script>
</body>
